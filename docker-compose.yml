services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
      
  frontend:
    build: ../BotXPert-Frontend
    ports:
      - "3000:3000"
    volumes:
      - ../BotXPert-Frontend:/app
    working_dir: /app
    command: sh -c "npm install && npm run start"


